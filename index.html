<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no" />
    <title>NavidOS</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body class="bg-[#000000] text-white overflow-hidden select-none m-0 p-0 w-screen h-screen">
    <div id="app-splash">
      <img src="./splash.png" class="splash-img" alt="NavidOS" />
    </div>
    <div id="root" class="w-full h-full relative"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
